spring.application.name=card-game-platform

# Database credentials are supplied by environment variables, never committed.
spring.datasource.url=${CARD_GAME_DB_URL:jdbc:mysql://localhost:3306/card_game_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate validates future entity mappings against the schema; it never creates
# or changes database tables. The SQL migration remains the schema authority.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
